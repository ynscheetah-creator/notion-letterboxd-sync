name: Refresh streaming availability

on:
  schedule:
    - cron: "5 3 * * *"   # 06:05 TRT (her gün)
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - recent

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh streaming availability
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          
          MODE="${{ github.event.inputs.mode }}"
          MODE="${MODE:-all}"
          
          echo "Starting streaming refresh (TR + MUBI global, mode: ${MODE})"
          python -m src.main --refresh-mubi "${MODE}"
          echo "Streaming refresh completed successfully!"
