name: Fill missing fields

on:
  schedule:
    - cron: "0 5 * * *"    # 08:00 TRT
    - cron: "0 20 * * *"   # 23:00 TRT
  workflow_dispatch:
    inputs:
      force_recent:
        description: "Son N sayfayı zorla (boş bırak=devre dışı)"
        required: false
        default: ""
      set_covers:
        description: "Backdrop URL'lerini cover olarak ayarla (tek seferlik)"
        required: false
        default: "false"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          FORCE_RECENT="${{ github.event.inputs.force_recent }}"
          SET_COVERS="${{ github.event.inputs.set_covers }}"
          if [ "${SET_COVERS}" = "true" ]; then
            python -m src.main --set-covers
          elif [ -n "${FORCE_RECENT}" ]; then
            python -m src.main --force-recent "${FORCE_RECENT}"
          else
            python -m src.main
          fi
